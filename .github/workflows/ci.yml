name: PaymentAPI CI

on:
push:
branches: [main]
pull_request:
branches: [main]

jobs:
test:
runs-on: ubuntu-latest

```
services:
  postgres:
    image: postgres:16
    env:
      POSTGRES_USER: paymentapi
      POSTGRES_PASSWORD: paymentapi_test_password
      POSTGRES_DB: payment_api_test
    ports:
      - 5432:5432
    options: >-
      --health-cmd "pg_isready -U paymentapi -d payment_api_test"
      --health-interval 5s
      --health-timeout 5s
      --health-retries 10

env:
  DATABASE_URL: postgresql+asyncpg://paymentapi:payment_api_test_password@localhost:5432/payment_api_test
  SERECT_KEY: ci-test-secret-key-not-for-production

steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.13"
      cache: pip
      cache-dependency-path: requirements.txt

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Verify PostgreSQL connection
    run: |
      python -c "import asyncio, asyncpg; asyncio.run(asyncpg.connect('postgresql://paymentapi:payment_api_test_password@localhost:5432/payment_api_test'))"

  - name: Apply database migrations
    run: alembic upgrade head

  - name: Run tests
    run: pytest -q
```
